---
# nginx_setup: Nginx reverse proxy 80 -> 127.0.0.1:5000 (idempotent).
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: present
    update_cache: true

- name: Deploy reverse-proxy site config (80 -> 127.0.0.1:5000)
  ansible.builtin.template:
    src: default.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable the site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    state: link
  notify: Reload Nginx

- name: Remove default site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false

- name: Ensure Nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
