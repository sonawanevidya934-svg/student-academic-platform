[defaults]
# Default inventory for local validation and EC2 runs.
inventory = inventory.ini
roles_path = roles
# Do not create .retry files on failure (keeps repo clean for beginners).
retry_files_enabled = False
# EC2 hosts change IPs often; strict checking is re-enabled in prod via env.
host_key_checking = False
# Show callback output clearly for college demos.
stdout_callback = default

[privilege_escalation]
# Escalation is also set explicitly per-play (become: true) for clarity.
become = False
